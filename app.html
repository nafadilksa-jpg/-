<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نافادل | Nafadil - دخول</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #fcfbf9; /* لون الخلفية الكريمي الفاتح من كرت العمل */
            color: #333; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            padding: 20px; 
        }

        /* حاوية التسجيل (الكرت الأبيض المركزي) */
        .auth-card { 
            background: #ffffff; 
            padding: 50px 30px; 
            border-radius: 28px; 
            box-shadow: 0 15px 40px rgba(230, 126, 34, 0.05); /* ظل ناعم جداً برتقالي */
            text-align: center; 
            max-width: 400px; 
            width: 100%; 
            border: 1px solid #f2efea; 
        }

        /* --- تصميم الهوية البصرية (اللوقو والكتابة فوق بعض) --- */
        .brand-section { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin-bottom: 35px; 
        }

        /* تصميم شعار نافادل (نـ) بالـ CSS مطابق للكرت */
        .brand-logo { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative; 
            margin-bottom: 15px; 
        }
        .logo-dots { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 5px; 
            margin-left: -22px; /* إزاحة النقطتين لليمين قليلاً لضبطها فوق المنحنى */
        }
        .logo-dot { 
            width: 9px; 
            height: 9px; 
            background-color: #e67e22; /* اللون البرتقالي الرسمي */
            border-radius: 50%; 
        }
        .logo-curve { 
            width: 48px; 
            height: 48px; 
            border: 5.5px solid #e67e22; 
            border-top: none; /* إزالة الضلع العلوي لعمل المنحنى U */
            border-radius: 0 0 28px 28px; /* تدوير الحواف السفلية */
            position: relative; 
        }
        /* إضافة الضلع الصغير الصاعد على اليمين */
        .logo-curve::after { 
            content: ''; 
            position: absolute; 
            top: -5.5px; 
            right: -5.5px; 
            width: 5.5px; 
            height: 14px; 
            background-color: #e67e22; 
        }

        /* تصميم الكتابة (العربي وتحته الإنجليزي) */
        .brand-name-ar { 
            color: #e67e22; 
            font-size: 32px; 
            font-weight: bold; 
            margin-bottom: 2px; 
            letter-spacing: 1px; 
        }
        .brand-name-en { 
            color: #e67e22; 
            font-size: 26px; 
            font-weight: 500; /* وزن أخف قليلاً للإنجليزي */
            letter-spacing: 0.5px; 
        }

        /* وصف المنصة الهادئ */
        .brand-desc { 
            color: #7f8c8d; 
            font-size: 14px; 
            margin-bottom: 30px; 
            line-height: 1.6; 
        }

        /* --- تصميم حقول الإدخال والأزرار --- */
        .input-group { 
            margin-bottom: 20px; 
            text-align: right; 
        }
        .input-label { 
            display: block; 
            font-size: 13px; 
            color: #7f8c8d; 
            margin-bottom: 8px; 
            margin-right: 5px; 
        }
        .auth-input { 
            width: 100%; 
            padding: 15px; 
            border: 2px solid #f2efea; 
            border-radius: 16px; 
            text-align: center; 
            font-size: 16px; 
            outline: none; 
            transition: 0.3s; 
            background: #faf9f6; 
        }
        .auth-input:focus { 
            border-color: #e67e22; 
            background: #fff; 
            box-shadow: 0 0 0 4px rgba(230, 126, 34, 0.1); 
        }

        .btn-primary { 
            background-color: #e67e22; 
            color: white; 
            width: 100%; 
            padding: 15px; 
            border: none; 
            border-radius: 16px; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer; 
            transition: 0.3s; 
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.2); 
        }
        .btn-primary:hover { 
            background-color: #d35400; 
            transform: translateY(-2px); 
        }

    </style>
</head>
<body>

    <div class="auth-card">
        
        <div class="brand-section">
            <div class="brand-logo">
                <div class="logo-dots">
                    <div class="logo-dot"></div>
                    <div class="logo-dot"></div>
                </div>
                <div class="logo-curve"></div>
            </div>
            <div class="brand-name-ar">نافادل</div>
            <div class="brand-name-en">Nafadil</div>
        </div>

        <p class="brand-desc">منصة التحكم الأبوية الذكية لأجهزة الأبناء <br> حماية، توجيه، واطمئنان.</p>

        <div class="input-group">
            <label class="input-label" for="phoneInput">رقم الجوال المسجل:</label>
            <input type="tel" id="phoneInput" class="auth-input" placeholder="05xxxxxxx" pattern="[0-5]{2}[0-9]{8}" required>
        </div>

        <button class="btn-primary" onclick="requestOTP()">إرسال رمز التحقق</button>

    </div>

    <script>
        function requestOTP() {
            let phone = document.getElementById('phoneInput').value;
            if (phone.trim() === "" || phone.length < 9) {
                alert("يرجى إدخال رقم جوال صحيح (05xxxxxxx).");
                return;
            }
            // محاكاة إرسال الرمز وتوجيه المستخدم (يمكن استبداله بطلب حقيقي لاحقاً)
            alert("سيتم إرسال رمز التحقق المباشر إلى رقم الجوال: " + phone);
            // window.location.href = 'verify.html'; // مثال للتوجيه لصفحة التحقق
        }
    </script>
</body>
</html>
